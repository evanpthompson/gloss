<!doctype html>
<meta charset="utf-8">
<title>gloss</title>
<style>
  :root {
    --bg: #0f1115; --fg: #e8e8ea; --dim: #6b7280;
    --recall: #7dd3a0; --jargon: #f0b45f; --error: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); height: 100vh;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; padding: 3vh 3vw; gap: 2vh;
  }
  /* Cards are sized to be read in about a second from a second screen,
     not to fit a lot of text. If it doesn't fit, it was too long. */
  #cards { flex: 1; display: flex; flex-direction: column; gap: 2vh; justify-content: center; }
  .card {
    border-left: 4px solid var(--kind); padding: 1.4vh 0 1.4vh 1.6vw;
    animation: in 140ms ease-out;
  }
  .card[data-kind="recall"] { --kind: var(--recall); }
  .card[data-kind="jargon"] { --kind: var(--jargon); }
  /* Zero cards is the normal state, so a broken backend has to look loud —
     otherwise "down" and "nothing to say" are the same blank screen. */
  .card[data-kind="error"] { --kind: var(--error); }
  .label { font-size: clamp(20px, 3.2vw, 46px); font-weight: 600; letter-spacing: -0.01em; }
  .detail { font-size: clamp(13px, 1.4vw, 21px); color: var(--dim); margin-top: 0.5vh; }
  .tag {
    font-size: clamp(10px, 0.85vw, 13px); text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--kind); margin-bottom: 0.4vh;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  /* Cards expire rather than being cleared, so they need a way out that does
     not snap. Removal is the only motion on an otherwise still screen. */
  .card.out { opacity: 0; transition: opacity 220ms ease-in; }
  /* Empty is the normal state, not an error — most turns produce no cards. */
  #idle { color: var(--dim); font-size: clamp(13px, 1.3vw, 18px); text-align: center; }
  #status { font-size: 12px; color: var(--dim); display: flex; gap: 0.6em; align-items: center; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
  #dot.up { background: var(--recall); }
</style>

<div id="cards"><div id="idle">listening</div></div>
<div id="status"><span id="dot"></span><span id="state">connecting</span></div>

<script>
  const cards = document.getElementById("cards");
  const dot = document.getElementById("dot");
  const state = document.getElementById("state");
  const url = (location.search.match(/[?&]ws=([^&]+)/) || [])[1] || "ws://localhost:8765/display";

  const TAGS = { recall: "your notes", jargon: "unfamiliar term", error: "not working" };

  // One entry per visible card, keyed by the topic id the server assigns.
  //
  // The display used to replace every card on each turn, so a topic discussed
  // across four turns flashed four times and nothing stayed still long enough
  // to be read — on a screen whose entire job is to be readable in a glance.
  // Now a card is found by id and updated in place; only genuinely new topics
  // move anything on screen.
  //
  // Lifecycle is not a local policy: the TTL arrives on each card and the cap
  // arrives with the batch, so a second screen opened halfway through a call is
  // configured by the first message it receives.
  const live = new Map();   // id -> { el, timer, touched }

  const showIdle = () => {
    if (live.size === 0 && !document.getElementById("idle"))
      cards.innerHTML = '<div id="idle">listening</div>';
  };
  const dropIdle = () => document.getElementById("idle")?.remove();

  function remove(id) {
    const entry = live.get(id);
    if (!entry) return;
    clearTimeout(entry.timer);
    live.delete(id);                       // freed immediately, so the same
    entry.el.classList.add("out");         // topic returning mid-fade gets a
    setTimeout(() => entry.el.remove(), 220);  // fresh element, not this one
    setTimeout(showIdle, 220);
  }

  function fill(el, c) {
    el.dataset.kind = c.kind;
    el.querySelector(".tag").textContent = TAGS[c.kind] || c.kind;
    el.querySelector(".label").textContent = c.label;
    el.querySelector(".detail").textContent = c.detail;
  }

  function render(list, max) {
    if (!list.length) return;   // zero cards is the normal turn; leave the screen alone
    dropIdle();
    for (const c of list) {
      const id = c.id || c.label;
      let entry = live.get(id);
      if (entry) {
        fill(entry.el, c);      // in place: no animation, no reflow, no flash
        clearTimeout(entry.timer);
      } else {
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = '<div class="tag"></div><div class="label"></div><div class="detail"></div>';
        fill(el, c);
        cards.appendChild(el);  // new topics append; existing ones never move
        entry = { el };
        live.set(id, entry);
      }
      entry.kind = c.kind;
      entry.touched = Date.now();
      entry.timer = setTimeout(() => remove(id), (c.ttl ?? 90) * 1000);
    }
    // Evict by least-recently-mentioned rather than oldest-created: a topic the
    // conversation keeps returning to should outlive a one-off from earlier.
    //
    // Error cards are outside the cap. They are the server speaking about
    // itself rather than content, they clear themselves in seconds, and the
    // first version of this let a transient outage evict a real card — which
    // then never came back, because the card that displaced it expired into
    // nothing. A twenty-second error must not cost a topic permanently.
    const content = () => [...live.entries()].filter(([, e]) => e.kind !== "error");
    while (content().length > (max ?? 3)) {
      let stalest = null;
      for (const [id, e] of content())
        if (!stalest || e.touched < live.get(stalest).touched) stalest = id;
      remove(stalest);
    }
  }

  function wipe() {
    for (const entry of live.values()) clearTimeout(entry.timer);
    live.clear();
    cards.innerHTML = '<div id="idle">listening</div>';
  }

  function connect() {
    const ws = new WebSocket(decodeURIComponent(url));
    ws.onopen = () => { dot.classList.add("up"); state.textContent = "connected"; wipe(); };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "cards") render(msg.cards, msg.max);
      if (msg.type === "clear") wipe();
    };
    ws.onclose = () => {
      dot.classList.remove("up");
      state.textContent = "reconnecting";
      // b_server restarts often during a session. Cards from before the restart
      // describe a conversation state the server no longer has, so they go.
      setTimeout(connect, 1000);
    };
    ws.onerror = () => ws.close();
  }
  connect();
</script>
