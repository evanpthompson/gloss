<!doctype html>
<meta charset="utf-8">
<title>gloss</title>
<style>
  :root {
    --bg: #0f1115; --fg: #e8e8ea; --dim: #6b7280;
    --recall: #7dd3a0; --jargon: #f0b45f; --error: #ef4444;
    /* HUD mode only. Defaults are the prototype's; ?near= &far= &stealth=
       override them, so a value can be tried without a rebuild. */
    --stealth: 1; --near: 0.85; --far: 0.45;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); height: 100vh;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; padding: 3vh 3vw; gap: 2vh;
  }
  /* Cards are sized to be read in about a second from a second screen,
     not to fit a lot of text. If it doesn't fit, it was too long. */
  #cards { flex: 1; display: flex; flex-direction: column; gap: 2vh; justify-content: center; }
  .card {
    border-left: 4px solid var(--kind); padding: 1.4vh 0 1.4vh 1.6vw;
    animation: in 140ms ease-out;
    /* A card is dismissed by clicking it, so it has to look like something you
       can click. Nothing else on this screen is a target. */
    cursor: pointer;
  }
  .card[data-kind="recall"] { --kind: var(--recall); }
  .card[data-kind="jargon"] { --kind: var(--jargon); }
  /* Zero cards is the normal state, so a broken backend has to look loud —
     otherwise "down" and "nothing to say" are the same blank screen. */
  .card[data-kind="error"] { --kind: var(--error); }
  .label { font-size: clamp(20px, 3.2vw, 46px); font-weight: 600; letter-spacing: -0.01em; }
  .detail { font-size: clamp(13px, 1.4vw, 21px); color: var(--dim); margin-top: 0.5vh; }
  .tag {
    font-size: clamp(10px, 0.85vw, 13px); text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--kind); margin-bottom: 0.4vh;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  /* A card leaves when it is dismissed or evicted, never on a clock, so it
     needs a way out that does not snap. Removal is the only motion on an
     otherwise still screen. */
  .card.out { opacity: 0; transition: opacity 220ms ease-in; }
  /* Selection is what a clicker acts on, so it has to be findable in a glance
     without becoming the loudest thing on screen. The border thickens; nothing
     moves, because movement is what the card lifecycle exists to avoid. */
  .card.sel { border-left-width: 10px; }
  /* Pinning is now protection from eviction rather than from a clock: a
     pinned card is the last thing pushed off when the cap is reached. The
     screen still has to say which ones, or a card that refuses to leave looks
     like a bug. */
  .card.pin .tag::after { content: " · pinned"; opacity: 0.75; }
  #cards.blank { visibility: hidden; }
  /* Empty is the normal state, not an error — most turns produce no cards. */
  #idle { color: var(--dim); font-size: clamp(13px, 1.3vw, 18px); text-align: center; }
  #status { font-size: 12px; color: var(--dim); display: flex; gap: 0.6em; align-items: center; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
  #dot.up { background: var(--recall); }

  /* --- HUD mode (Phase 4b, ?mode=wheel) ----------------------------------
     The same card nodes, drawn as a wheel. Not a second display and not a
     second DOM: everything Phase 3 fixed about card identity and lifecycle is
     orthogonal to how a card is painted, and duplicating the list was the
     fastest way to lose it. */
  #detail-wrap { display: none; }
  body[data-mode="wheel"] { position: relative; padding: 0; overflow: hidden; }
  /* Anchored to the midline and slid, rather than laid out in flow and
     centred. In flow, hiding the rows past the end of the list changed the
     column's own height, which moved the focused row 16px on screen at the
     ends of the list — measured, not theorised. */
  body[data-mode="wheel"] #cards {
    position: absolute; top: 50%; left: 3vw; right: 3vw;
    flex: none; gap: 0.6vh; justify-content: flex-start;
    opacity: var(--stealth);
    transition: transform 120ms ease-out; will-change: transform;
  }
  body[data-mode="wheel"] .card {
    display: flex; align-items: baseline; gap: 1vw;
    border-left-width: 3px; border-left-color: transparent;
    padding: 0.5vh 0 0.5vh 1.2vw; animation: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    /* Opacity and colour cross-fade; SIZE DOES NOT. An animated font-size is
       continuous motion on every row at once, and it reflows for 120ms, so the
       centring transform above computes against a layout still in flight —
       measured as 12px of focus drift from a fix meant to remove 16px of it. */
    transition: opacity 120ms linear, border-color 120ms linear;
  }
  /* Distance from the focus is the only thing that sets weight, and the focus
     row is the only one that carries kind colour. */
  body[data-mode="wheel"] .card[data-d="0"] {
    opacity: 1; font-size: clamp(22px, 3.4vw, 50px); font-weight: 600;
    border-left-color: var(--kind);
  }
  body[data-mode="wheel"] .card[data-d="1"] { opacity: var(--near); font-size: clamp(16px, 2.1vw, 30px); }
  body[data-mode="wheel"] .card[data-d="2"] { opacity: var(--far);  font-size: clamp(13px, 1.5vw, 21px); }
  body[data-mode="wheel"] .card[data-d="3"] { opacity: 0; font-size: clamp(13px, 1.5vw, 21px); pointer-events: none; }
  /* An error card is the server saying it is broken. "Down" and "scrolled out
     of view" must never look the same, so it is never dimmed by distance and
     `paint` never hides it. */
  body[data-mode="wheel"] .card[data-kind="error"] { opacity: 1; border-left-color: var(--error); }
  body[data-mode="wheel"] .card.out { opacity: 0; }
  /* Size and colour already carry the focus; thickening the border as well
     would shift the row's text 7px sideways on every move. */
  body[data-mode="wheel"] .card.sel { border-left-width: 3px; }
  body[data-mode="wheel"] .card .label { order: 1; font-size: inherit; font-weight: inherit; }
  body[data-mode="wheel"] .card .tag {
    order: 2; margin: 0; font-size: 0.42em; color: var(--dim);
  }
  body[data-mode="wheel"] .card .detail { display: none; }
  /* Progressive disclosure by dwell — Direction 2. Detail lives outside the
     column so revealing it moves no row. */
  body[data-mode="wheel"] #detail-wrap {
    display: block; position: absolute; top: 50%; left: 3vw; right: 3vw;
    margin-top: 7vh; opacity: var(--stealth); pointer-events: none;
  }
  #hud-detail {
    margin-left: 1.5vw; max-width: 60ch;
    font-size: clamp(13px, 1.4vw, 21px); color: var(--dim);
    opacity: 0; transition: opacity 260ms ease-out;
  }
  #hud-detail.on { opacity: 1; }
  /* Not dimmed by --stealth. A HUD you cannot see is a choice; a HUD that
     hides that it is disconnected is a fault. */
  body[data-mode="wheel"] #status { position: fixed; bottom: 1.4vh; left: 3vw; }
</style>

<div id="cards"><div id="idle">listening</div></div>
<div id="detail-wrap"><div id="hud-detail"></div></div>
<div id="status"><span id="dot"></span><span id="state">connecting</span></div>

<script>
  const cards = document.getElementById("cards");
  const dot = document.getElementById("dot");
  const state = document.getElementById("state");
  const url = (location.search.match(/[?&]ws=([^&]+)/) || [])[1] || "ws://localhost:8765/display";

  // Phase 4b. Default is the second screen that ships today; ?mode=wheel is
  // the HUD. One page, because the card lifecycle is the expensive part and it
  // is identical either way.
  const params = new URLSearchParams(location.search);
  const WHEEL = params.get("mode") === "wheel";
  // A bad value falls back to the default rather than to NaN. A HUD rendered
  // invisible because ?far=abc quietly became NaN is exactly the silent
  // failure this display exists to not have.
  const num = (name, dflt, lo, hi) => {
    if (!params.has(name)) return dflt;
    const v = Number(params.get(name));
    return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt;
  };
  const TUNE = {
    stealth: num("stealth", 100, 15, 100) / 100,
    near: num("near", 85, 0, 100) / 100,
    far: num("far", 45, 0, 100) / 100,
    sens: num("wheel", 4, 1, 10),
    dwell: num("dwell", 600, 0, 5000),
  };

  const TAGS = { recall: "your notes", jargon: "unfamiliar term", error: "not working" };
  // On the HUD the border colour already carries kind, and § 4b Direction 2 is
  // "one word beats six" — "UNFAMILIAR TERM" beside a one-word term is more
  // text than the term itself. The mark shrinks rather than disappearing:
  // colour is the first thing --stealth takes away, and an error must still
  // say so in words when it has been dimmed to nearly nothing.
  const HUD_TAGS = { recall: "yours", jargon: "term", error: "not working" };

  // One entry per visible card, keyed by the topic id the server assigns.
  //
  // The display used to replace every card on each turn, so a topic discussed
  // across four turns flashed four times and nothing stayed still long enough
  // to be read — on a screen whose entire job is to be readable in a glance.
  // Now a card is found by id and updated in place; only genuinely new topics
  // move anything on screen.
  //
  // Lifecycle is not a local policy: the TTL arrives on each card and the cap
  // arrives with the batch, so a second screen opened halfway through a call is
  // configured by the first message it receives.
  //
  // A card with no TTL, or a TTL of zero, stays until it is dismissed. That is
  // the MVP default for content cards (`GLOSS_CARD_TTL_S=0`) and it came from
  // use rather than from a measurement: you look up when the call lets you,
  // not when a timer says to, so roughly half the cards in a session were
  // never seen at all. Status cards still carry a TTL, because "the vendor was
  // down 20 seconds ago" goes stale on its own and nobody dismisses a message
  // about a problem that has already passed.
  const live = new Map();   // id -> { el, timer, touched, kind, pinned }

  // --- clicker control (Phase 4a) -----------------------------------------
  //
  // A Bluetooth presenter is an HID keyboard: it sends PageUp/PageDown or the
  // arrow keys, and usually one "blank screen" key. So there is no local
  // process and no new transport — this page listens for keydown, which is all
  // a clicker was ever going to produce.
  //
  // That works because the display is a dedicated second screen with nothing
  // else focused. On a machine where the video call has focus, the keys go to
  // the call instead; see SPEC.md § 4a for that case, which needs a real
  // global-hotkey listener and is deliberately not built here.
  let selected = null;      // id the clicker acts on
  let blanked = false;

  const order = () => [...live.keys()];

  // Split so `paint` can re-home a lost focus without calling back into
  // `select`, which calls `paint`.
  function mark(id) {
    for (const [key, entry] of live) entry.el.classList.toggle("sel", key === id);
    selected = live.has(id) ? id : null;
  }

  function select(id) {
    mark(id);
    paint();
  }

  function step(delta) {
    const ids = order();
    if (!ids.length) return;
    const at = ids.indexOf(selected);
    // No selection yet: start at the newest, which is the card most likely to
    // be the one being acted on.
    select(ids[at === -1 ? ids.length - 1 : (at + delta + ids.length) % ids.length]);
  }

  function togglePin(id = selected) {
    const entry = live.get(id);
    if (!entry) return;
    entry.pinned = !entry.pinned;
    entry.el.classList.toggle("pin", entry.pinned);
    clearTimeout(entry.timer);
    // Only a card that had a clock gets it back. Unpinning a content card
    // does not start one it never had.
    if (!entry.pinned && entry.ttl > 0)
      entry.timer = setTimeout(() => remove(id), entry.ttl * 1000);
  }

  function dismiss(id = selected) {
    if (!live.has(id)) return;
    const ids = order();
    const next = ids[(ids.indexOf(id) + 1) % ids.length];
    remove(id);
    select(next === id ? null : next);
  }

  function toggleBlank() {
    blanked = !blanked;
    cards.classList.toggle("blank", blanked);
  }

  // Generous key mapping, because presenters disagree about what they send.
  const KEYS = {
    ArrowRight: () => step(1),   PageDown: () => step(1),   " ": () => step(1),
    ArrowLeft: () => step(-1),   PageUp: () => step(-1),
    Enter: () => togglePin(),    p: () => togglePin(),
    Backspace: () => dismiss(),  Delete: () => dismiss(),   x: () => dismiss(),
    b: () => toggleBlank(),      ".": () => toggleBlank(),  F5: () => toggleBlank(),
    Escape: () => select(null),
  };

  document.addEventListener("keydown", (e) => {
    const act = KEYS[e.key];
    if (!act) return;
    e.preventDefault();   // or PageDown scrolls the page out from under the cards
    act();
  });

  // --- HUD mode (Phase 4b) -----------------------------------------------
  //
  // The wheel HUD is a *rendering* of the selection model 4a already has:
  // `selected` is the focused row, `step()` is what moves it, and the wheel is
  // one more input that calls it. Cards still arrive, update in place, expire
  // and evict exactly as they do on the second screen.
  //
  // It is not the `scroll` condition that finished 0-of-14 in the glance test.
  // That one moved on its own and looped, so it never ended and nobody ever
  // finished it. This is still until you move it, and it stops where you stop:
  // motion as a cue you initiate, which is what § 4b Direction 3 asked for.
  //
  // The prototype's sliders are gone. They existed to find the numbers; the
  // numbers now arrive as query params, and a HUD does not ship a control
  // panel it should never show.
  const hudDetail = document.getElementById("hud-detail");
  const VISIBLE = 2;        // rows either side of the focus that render at all
  let dwellTimer = null;

  function paint() {
    if (!WHEEL) return;
    const ids = order();
    // The HUD always has a focus. On the second screen no selection is the
    // normal state; here it would mean no row is at full size and the row the
    // eye is meant to land on without looking does not exist.
    if (!live.has(selected) && ids.length) mark(ids[ids.length - 1]);
    const at = ids.indexOf(selected);
    ids.forEach((id, i) => {
      const entry = live.get(id);
      const d = at === -1 ? VISIBLE + 1 : Math.abs(i - at);
      entry.el.dataset.d = String(Math.min(d, VISIBLE + 1));
      entry.el.style.display = d > VISIBLE && entry.kind !== "error" ? "none" : "";
    });
    centre();
    // Detail hides the instant the focus moves, and comes back only if the new
    // focus is held. A detail line that survives a move is a line read about
    // the wrong card.
    hudDetail.classList.remove("on");
    clearTimeout(dwellTimer);
    if (selected) dwellTimer = setTimeout(showDetail, TUNE.dwell);
  }

  function centre() {
    // The focused row holds one fixed screen height, always. Measured rather
    // than computed: the focused row is larger than its neighbours, so its
    // height is not knowable from a row count. A HUD whose focus row moves
    // reintroduces the "re-find the card" cost the Phase 3 lifecycle deleted.
    const entry = live.get(selected);
    if (!entry) { cards.style.transform = ""; return; }
    cards.style.transform =
      `translateY(${-(entry.el.offsetTop + entry.el.offsetHeight / 2)}px)`;
  }

  function showDetail() {
    const entry = live.get(selected);
    if (!entry) return;
    hudDetail.textContent = entry.el.querySelector(".detail").textContent;
    hudDetail.classList.add("on");
  }

  if (WHEEL) {
    document.body.dataset.mode = "wheel";
    const root = document.documentElement.style;
    root.setProperty("--stealth", TUNE.stealth);
    root.setProperty("--near", TUNE.near);
    root.setProperty("--far", TUNE.far);

    let travel = 0;   // fractional wheel travel between rows
    addEventListener("wheel", (e) => {
      e.preventDefault();
      // Sensitivity is a divisor on accumulated travel, so a trackpad flick
      // and a notched mouse wheel can be dialled to the same feel.
      travel += e.deltaY / (110 - TUNE.sens * 10);
      const steps = Math.trunc(travel);
      if (steps) { travel -= steps; step(steps); }
    }, { passive: false });

    // Detail now, for when the dwell is longer than the patience.
    addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() !== "d") return;
      e.preventDefault();
      showDetail();
    });

    addEventListener("resize", centre);
  }

  const showIdle = () => {
    if (live.size === 0 && !document.getElementById("idle"))
      cards.innerHTML = '<div id="idle">listening</div>';
  };
  const dropIdle = () => document.getElementById("idle")?.remove();

  function remove(id) {
    const entry = live.get(id);
    if (!entry) return;
    clearTimeout(entry.timer);
    if (selected === id) selected = null;  // never point at a card that is gone
    live.delete(id);                       // freed immediately, so the same
    entry.el.classList.add("out");         // topic returning mid-fade gets a
    setTimeout(() => entry.el.remove(), 220);  // fresh element, not this one
    setTimeout(showIdle, 220);
    paint();   // an expiring focus hands the focus on rather than losing it
  }

  function fill(el, c) {
    el.dataset.kind = c.kind;
    el.querySelector(".tag").textContent = (WHEEL ? HUD_TAGS : TAGS)[c.kind] || c.kind;
    el.querySelector(".label").textContent = c.label;
    el.querySelector(".detail").textContent = c.detail;
  }

  function render(list, max) {
    if (!list.length) return;   // zero cards is the normal turn; leave the screen alone
    dropIdle();
    for (const c of list) {
      const id = c.id || c.label;
      let entry = live.get(id);
      if (entry) {
        fill(entry.el, c);      // in place: no animation, no reflow, no flash
        clearTimeout(entry.timer);
      } else {
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = '<div class="tag"></div><div class="label"></div><div class="detail"></div>';
        fill(el, c);
        // Click dismisses THIS card, not the selected one. On a second screen
        // the mouse and the clicker are different hands, and dismissing
        // something other than what was clicked is the kind of surprise that
        // makes people stop touching the display mid-call.
        el.addEventListener("click", () => dismiss(id));
        cards.appendChild(el);  // new topics append; existing ones never move
        entry = { el };
        live.set(id, entry);
      }
      entry.kind = c.kind;
      entry.ttl = c.ttl ?? 0;   // no TTL means it stays until dismissed
      entry.touched = Date.now();
      // A pinned card has been held on purpose. It ignores its TTL and every
      // refresh of it, until it is unpinned or dismissed.
      if (!entry.pinned && entry.ttl > 0)
        entry.timer = setTimeout(() => remove(id), entry.ttl * 1000);
    }
    // Evict by least-recently-mentioned rather than oldest-created: a topic the
    // conversation keeps returning to should outlive a one-off from earlier.
    //
    // Error cards are outside the cap. They are the server speaking about
    // itself rather than content, they clear themselves in seconds, and the
    // first version of this let a transient outage evict a real card — which
    // then never came back, because the card that displaced it expired into
    // nothing. A twenty-second error must not cost a topic permanently.
    // Never evict what just arrived. Filtering to unpinned first would isolate
    // exactly that card when everything else is pinned, so a screen full of
    // pins silently stopped showing anything new — fine-looking and stale,
    // which is the failure this display cannot afford.
    const arrived = new Set(list.map((c) => c.id || c.label));
    const content = () =>
      [...live.entries()].filter(([id, e]) => e.kind !== "error" && !arrived.has(id));
    const visible = () => [...live.values()].filter((e) => e.kind !== "error").length;

    while (visible() > (max ?? 3) && content().length) {
      // Pinned cards go last, but the cap is absolute: a screen that grows
      // without limit stops being readable. Pinning everything is a choice to
      // fill the screen, not a way to make it bigger.
      const pool = content();
      const preferred = pool.filter(([, e]) => !e.pinned);
      const from = preferred.length ? preferred : pool;
      let stalest = from[0][0];
      for (const [id, e] of from)
        if (e.touched < live.get(stalest).touched) stalest = id;
      remove(stalest);
    }
    // The HUD renders exactly one row legibly, so a focus that lags the
    // conversation makes it *worse* than the second screen it replaces: the
    // card for the question just asked would be the dim one, and every turn
    // would start with a wheel. The newest arrival takes the focus; the wheel
    // takes it straight back. This is a judgement, not a measurement — no run
    // has touched it. SPEC § 4b records it as such.
    if (WHEEL) {
      const arriving = list.map((c) => c.id || c.label).filter((id) => live.has(id)).pop();
      if (arriving) mark(arriving);
    }
    paint();
  }

  function wipe() {
    for (const entry of live.values()) clearTimeout(entry.timer);
    live.clear();
    selected = null;
    cards.innerHTML = '<div id="idle">listening</div>';
    paint();
  }

  function connect() {
    const ws = new WebSocket(decodeURIComponent(url));
    ws.onopen = () => { dot.classList.add("up"); state.textContent = "connected"; wipe(); };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "cards") render(msg.cards, msg.max);
      // A card painted from the local glossary the instant a turn ended, which
      // the model then did not corroborate. Taken down rather than left to
      // time out beside the model's own card on the same topic.
      if (msg.type === "expire") (msg.ids || []).forEach(remove);
      if (msg.type === "clear") wipe();
    };
    ws.onclose = () => {
      dot.classList.remove("up");
      state.textContent = "reconnecting";
      // b_server restarts often during a session. Cards from before the restart
      // describe a conversation state the server no longer has, so they go.
      setTimeout(connect, 1000);
    };
    ws.onerror = () => ws.close();
  }
  connect();
</script>
