stages:
  - test
  - build
  - trigger-e2e

# Unit and integration tests. Runs before the image is built, so a broken
# provider chain cannot be pushed to the registry and then discovered by the
# e2e job two stages later.
#
# The whole suite is offline: integration tests run b_server against a local
# fake vendor speaking both wire formats (tests/fake_vendor.py) rather than
# against Anthropic or DeepSeek. That is deliberate — a gate that needs a funded
# account and a network is a gate that gets disabled the first time it is
# inconvenient, and this one has to work in the environment where merges happen.
test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    # Inside the project directory so GitLab can cache it; the default lives in
    # $HOME, which cache paths may not reach.
    PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    # display.html is tested in a real browser. Locally a developer without one
    # gets a skip; here a missing browser is a failure, because a check that
    # could not run is not a pass and a silent skip in the environment that
    # gates is indistinguishable from green.
    GLOSS_REQUIRE_BROWSER_TESTS: "1"
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths:
      - .uv-cache
      - .playwright-browsers
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run playwright install --with-deps chromium
    - uv run pytest --timeout=60
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Builds b_server.py's image and pushes it to this project's GitLab
# Container Registry, tagged :main (a moving cache target — pulled as
# --cache-from on the next build so unchanged layers, e.g. `uv sync`,
# don't get rebuilt from scratch every pipeline run) and :<short-sha>
# (an immutable, addressable copy of exactly what this commit produced).
build-b-server:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE/b-server:main" || true
    - >
      docker build
      --cache-from "$CI_REGISTRY_IMAGE/b-server:main"
      -t "$CI_REGISTRY_IMAGE/b-server:$CI_COMMIT_SHORT_SHA"
      -t "$CI_REGISTRY_IMAGE/b-server:main"
      .
    - docker push "$CI_REGISTRY_IMAGE/b-server:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/b-server:main"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# The E2E pipe test lives in the separate gloss-e2e project, which checks this
# project out as a sibling and runs against it — it needs two containers and a
# mocked Deepgram, which is why it is not in the `test` stage above. This job
# makes sure it actually runs whenever main changes here, instead of only
# running when someone happens to push to the e2e repo.
trigger-e2e-tests:
  stage: trigger-e2e
  trigger:
    project: navetoocool/gloss-e2e
    branch: main
    strategy: depend
  variables:
    # Name the commit under test. Without this the e2e clones whatever this
    # project's main happens to be when its own job starts, which is not
    # necessarily the commit that triggered it — two pushes landing close
    # together and the e2e reports green for code it never built. It refuses
    # to run rather than test the wrong revision.
    GLOSS_COMMIT_SHA: $CI_COMMIT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
